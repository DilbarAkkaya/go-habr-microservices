services:
  postgres:
    image: postgres:15-alpine
    container_name: habr_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: habr_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - habr_network  
  kafka:
    image: apache/kafka:3.7.0
    container_name: habr_kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:9093'
      KAFKA_LISTENERS: 'PLAINTEXT://:9092,CONTROLLER://:9093'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: '/tmp/kraft-combined-logs'
    networks:
      - habr_network

  redis:
    image: redis:7-alpine
    container_name: habr_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - habr_network
  auth:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: habr_auth
    command: go run cmd/auth/main.go
    ports:
      - "18081:8081"
    environment:
      DATABASE_URL: host=postgres port=5432 user=user password=password dbname=habr_db sslmode=disable
      KAFKA_BROKER: kafka:9092
      AUTH_HOST: http://auth:8081
      JWT_SECRET: super-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - habr_network

  posts:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: habr_posts
    command: go run cmd/posts/main.go
    ports:
      - "18082:8082"
    environment:
      DATABASE_URL: host=postgres port=5432 user=user password=password dbname=habr_db sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: super-secret-key
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - habr_network

  notifications:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: habr_notifications
    command: go run cmd/notifications/main.go
    environment:
      KAFKA_BROKER: kafka:9092
      AUTH_HOST: http://auth:8081
    depends_on:
      kafka:
        condition: service_started
    networks:
      - habr_network
  mailpit:
    image: axllent/mailpit
    container_name: habr_mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data:

networks:
  habr_network:
    driver: bridge